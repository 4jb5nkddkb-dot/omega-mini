[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-mini"
version = "3.3.0"
description = "Omega v3.3 — Zero-dependency constrained decision & safety learning framework (Python stdlib)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "4jb5nkddkb-dot" }
]
keywords = ["omega", "safety", "constrained-decision", "audit", "calibration", "stdlib"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/4jb5nkddkb-dot/omega-mini"
Repository = "https://github.com/4jb5nkddkb-dot/omega-mini"
Issues = "https://github.com/4jb5nkddkb-dot/omega-mini/issues"

[tool.setuptools]
py-modules = ["omega"]
