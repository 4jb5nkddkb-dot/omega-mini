name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run self-test
        run: |
          python -c "
          from omega import Omega, Prediction, StaticEnv
          omega = Omega(secret='self-test-secret')
          owner = omega.owner_handle()
          omega.set_goal(owner, {'temperature': 22.0})
          omega.set_limits(owner, hard_min={'temperature': 10.0}, hard_max={'temperature': 30.0})
          token = omega.new_token(owner, 'measure')
          env = StaticEnv({'temperature': 22.0})
          result = omega.run(env, token, prediction=Prediction(expected={'temperature': 22.0}, conf=0.95))
          assert result.decision.name == 'APPLY'
          assert env.calls == 1
          assert omega.verify_audit()
          print('Omega self-test: PASS')
          "
      - name: Run standard-library test suite
        run: python tests/test_omega.py
      - name: Run experiment suite
        run: python experiments/experiment.py --rounds 20

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omega-mini
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
